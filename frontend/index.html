<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>DCPI Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <div id="app">

    <!-- ======= PANTALLA: BUSCADOR ======= -->
    <section id="screen-search" class="screen active">
      <header class="topbar">
        <h1 class="brand">DCPI <span>Music</span></h1>
      </header>

      <div class="search-box">
        <svg class="icon-search" viewBox="0 0 24 24" width="20" height="20"><path d="M21 21l-4.35-4.35M17 10.5A6.5 6.5 0 1 1 4 10.5a6.5 6.5 0 0 1 13 0Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search-input" type="text" placeholder="Buscar canciones, artistas, álbumes…" autocomplete="off" />
      </div>

      <div id="search-status" class="hint"></div>
      <ul id="search-results" class="track-list"></ul>
    </section>

    <!-- ======= PANTALLA: REPRODUCTOR ======= -->
    <section id="screen-player" class="screen">
      <div id="player-bg" class="player-bg"></div>

      <header class="topbar">
        <button id="btn-back" class="icon-btn" aria-label="Volver">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="topbar-title">Reproduciendo</span>
        <button id="btn-favorite" class="icon-btn" aria-label="Favorito">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21s-7-4.35-9.5-8.5C.7 8.9 2.4 5 6 5c2 0 3.3 1.1 4 2.2C10.7 6.1 12 5 14 5c3.6 0 5.3 3.9 3.5 7.5C19 16.65 12 21 12 21Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </header>

      <div class="cover-wrap">
        <img id="cover-img" class="cover-img" alt="" />
        <div id="youtube-player-wrap" class="cover-img youtube-player-wrap hidden">
          <div id="youtube-player"></div>
        </div>
      </div>

      <div class="track-meta">
        <h2 id="track-title">—</h2>
        <p id="track-artist">—</p>
      </div>

      <!-- Letras sincronizadas -->
      <div id="lyrics-view" class="lyrics-view">
        <p class="lyrics-empty" id="lyrics-empty">Sin letras sincronizadas para esta canción.</p>
        <div id="lyrics-lines" class="lyrics-lines"></div>
      </div>

      <div class="progress-row">
        <span id="time-current" class="time mono">0:00</span>
        <input id="progress-bar" type="range" min="0" max="100" value="0" step="0.1" />
        <span id="time-total" class="time mono">0:00</span>
      </div>

      <div class="controls-row">
        <button id="btn-shuffle" class="icon-btn small" aria-label="Aleatorio">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-prev" class="icon-btn" aria-label="Anterior">
          <svg viewBox="0 0 24 24" width="26" height="26"><path d="M19 20L9 12l10-8v16ZM7 4v16" stroke="currentColor" stroke-width="2" fill="currentColor"/></svg>
        </button>
        <button id="btn-play" class="play-btn" aria-label="Reproducir">
          <svg id="icon-play" viewBox="0 0 24 24" width="30" height="30"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" width="30" height="30" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
        </button>
        <button id="btn-next" class="icon-btn" aria-label="Siguiente">
          <svg viewBox="0 0 24 24" width="26" height="26"><path d="M5 4l10 8-10 8V4Zm12 0v16" stroke="currentColor" stroke-width="2" fill="currentColor"/></svg>
        </button>
        <button id="btn-repeat" class="icon-btn small" aria-label="Repetir">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="volume-row">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 9v6h4l5 5V4L8 9H4Z" fill="currentColor"/></svg>
        <input id="volume-bar" type="range" min="0" max="1" value="1" step="0.01" />
      </div>

      <button id="btn-download" class="download-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" style="vertical-align:-3px;margin-right:6px;"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="download-btn-label">Descargar</span>
      </button>
    </section>

    <!-- ======= PANTALLA: HISTORIAL ======= -->
    <section id="screen-history" class="screen">
      <header class="topbar">
        <h1 class="section-title">Historial</h1>
        <button id="btn-clear-history" class="text-btn">Limpiar</button>
      </header>
      <ul id="history-list" class="track-list"></ul>
    </section>

    <!-- ======= PANTALLA: FAVORITOS ======= -->
    <section id="screen-favorites" class="screen">
      <header class="topbar">
        <h1 class="section-title">Favoritos</h1>
      </header>
      <ul id="favorites-list" class="track-list"></ul>
    </section>

    <!-- ======= MODAL: CALIDAD DE DESCARGA ======= -->
    <div id="download-modal" class="modal hidden">
      <div class="modal-sheet">
        <h3>Elegir formato y calidad</h3>
        <div id="format-options" class="chip-row"></div>
        <div id="quality-options" class="chip-row"></div>
        <button id="confirm-download" class="download-btn">Descargar</button>
        <button id="cancel-download" class="text-btn">Cancelar</button>
      </div>
    </div>

    <!-- ======= MINI-REPRODUCTOR FLOTANTE ======= -->
    <div id="mini-player" class="mini-player hidden">
      <img id="mini-cover" class="mini-cover" alt="" />
      <div class="mini-meta">
        <div id="mini-title" class="mini-title">—</div>
        <div id="mini-artist" class="mini-artist">—</div>
      </div>
      <button id="mini-play" class="mini-play-btn" aria-label="Reproducir/Pausar">
        <svg id="mini-icon-play" viewBox="0 0 24 24" width="20" height="20"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <svg id="mini-icon-pause" viewBox="0 0 24 24" width="20" height="20" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
      </button>
    </div>

    <!-- ======= NAVEGACIÓN INFERIOR ======= -->
    <nav id="bottom-nav" class="bottom-nav">
      <button class="nav-item active" data-screen="search">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M21 21l-4.35-4.35M17 10.5A6.5 6.5 0 1 1 4 10.5a6.5 6.5 0 0 1 13 0Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>Buscar</span>
      </button>
      <button class="nav-item" data-screen="history">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 8v5l3 3M12 3a9 9 0 1 0 9 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Historial</span>
      </button>
      <button class="nav-item" data-screen="favorites">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21s-7-4.35-9.5-8.5C.7 8.9 2.4 5 6 5c2 0 3.3 1.1 4 2.2C10.7 6.1 12 5 14 5c3.6 0 5.3 3.9 3.5 7.5C19 16.65 12 21 12 21Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>Favoritos</span>
      </button>
    </nav>
  </div>

  <script src="js/telegram.js"></script>
  <script src="js/api.js"></script>
  <script src="js/lyrics.js"></script>
  <script src="js/player.js"></script>
  <script src="js/search.js"></script>
  <script src="js/router.js"></script>
</body>
</html>
