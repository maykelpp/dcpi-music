name: DCPI Music simulated tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. pytest -q tests/test_simulated_methods.py
      - run: python -m compileall -q .
      - run: node --check ../frontend/js/library.js && node --check ../frontend/js/player.js && node --check ../frontend/js/router.js && node --check ../frontend/js/search.js
